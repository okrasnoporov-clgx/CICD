apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alpha-test-app.fullname" . }}-config
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "alpha-test-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
