apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-qa
  namespace: qa
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # $1 подставит всё, что захвачено в скобки (.*)
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Захватываем всё, что идет ПОСЛЕ /qa/stub-service/
          - path: /qa/stub-service/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stub-service
                port:
                  name: http

          - path: /qa/stub-service-preview/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stub-service-preview
                port:
                  name: http
