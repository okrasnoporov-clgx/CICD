apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: stub-service
  namespace: qa
  labels:
    app.kubernetes.io/name: stub-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: stub-service
      app: stub-service
  strategy:
    blueGreen:
      activeService: stub-service
      previewService: stub-service-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stub-service
        app: stub-service
    spec:
      containers:
        - name: stub-app-service
          image: ghcr.io/okrasnoporov-clgx/stub-app-service:0.0.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGO_URI
              value: mongodb://mongodb:27017
          readinessProbe:
            httpGet:
              path: /alpha/v1/info
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alpha/v1/info
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
